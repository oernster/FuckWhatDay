<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:image" content="$site_url$image">
  <link rel="canonical" href="$url">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FuckWhatDay">
  <meta property="og:url" content="$url">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="$image_size">
  <meta property="og:image:height" content="$image_size">
  <meta property="og:image:alt" content="FuckWhatDay app icon">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$site_url$image">
  <meta name="twitter:image:alt" content="FuckWhatDay app icon">$structured_data
  <link rel="stylesheet" href="style.css">
  <script>window.goatcounter = {path: function (p) { return location.host + p }}</script>
  <script data-goatcounter="https://oernster.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<!-- Generated by tools/site.py from site/layout.html and site/pages; edit those. -->

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html">
      <img src="img/favicon-32.png" width="32" height="32" alt="">
      <span>FuckWhatDay</span>
    </a>
    <nav class="nav-links" aria-label="Pages">
      $nav
      <a class="nav-cta" href="https://github.com/oernster/FuckWhatDay">GitHub</a>
    </nav>
  </div>
</header>

<main>
$content
</main>

<nav class="pager wrap" aria-label="Next and previous page">
    $pager
</nav>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="brand">
      <img src="img/favicon-32.png" width="32" height="32" alt="">
      <span>FuckWhatDay</span>
    </div>
    <p>Made with eight instructions and poor judgement. GPL-3.0. &copy; Oliver Ernster.</p>
    <p><a href="https://github.com/oernster/FuckWhatDay">GitHub</a> &middot; <a href="https://github.com/oernster/FuckWhatDay/blob/main/TESTING.md">How it is tested</a> &middot; <a href="https://ernster.dev/commercial-licensing.html">Commercial licences</a></p>
  </div>
</footer>

$scripts
</body>
</html>
